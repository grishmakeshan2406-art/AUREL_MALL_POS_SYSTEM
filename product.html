<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | SmartGen Mall</title>

    <link rel="stylesheet" href="product.css">

</head>


<body>

    <!-- HEADER -->

    <header>

        <nav>

            <div class="logo">
                <img src="logo.png">
            </div>

            <div class="page-title">
                PRODUCTS
            </div>

            <a href="shopowner.html" class="back-button">
                ← Dashboard
            </a>

        </nav>

    </header>



    <!-- MAIN -->

    <main class="products-page">


        <!-- PAGE INTRO -->

        <section class="products-intro">

            <p class="section-label">
                SHOP MANAGEMENT
            </p>

            <h1>
                Products
            </h1>

            <p>
                Manage the products available in your shop.
            </p>

        </section>



        <!-- PRODUCT CONTROLS -->

        <section class="product-controls">

            <div class="search-box">

                <input
                    type="text"
                    id="searchProduct"
                    placeholder="Search products..."
                >

            </div>


            <button
                class="add-product-button"
                id="openAddProduct"
            >
                + Add Product
            </button>

        </section>



        <!-- ADD PRODUCT FORM -->

        <section
            class="product-form-container"
            id="productFormContainer"
        >

            <div class="product-form">

                <div class="form-header">

                    <div>

                        <p class="section-label">
                            PRODUCT DETAILS
                        </p>

                        <h2>
                            Add Product
                        </h2>

                    </div>

                    <button
                        class="close-button"
                        id="closeProductForm"
                    >
                        ×
                    </button>

                </div>


                <form id="productForm">

                    <div class="form-group">

                        <label for="productName">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="productName"
                            placeholder="Enter product name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="productCategory">
                            Category
                        </label>

                        <input
                            type="text"
                            id="productCategory"
                            placeholder="Enter category"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="productPrice">
                                Price
                            </label>

                            <input
                                type="number"
                                id="productPrice"
                                placeholder="₹ 0"
                                min="0"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="productStock">
                                Stock
                            </label>

                            <input
                                type="number"
                                id="productStock"
                                placeholder="0"
                                min="0"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="save-product-button"
                    >
                        Add Product
                    </button>

                </form>

            </div>

        </section>



        <!-- PRODUCT TABLE -->

        <section class="products-section">

            <div class="table-heading">

                <div>

                    <p class="section-label">
                        CATALOGUE
                    </p>

                    <h2>
                        All Products
                    </h2>

                </div>

                <p id="productCount">
                    0 Products
                </p>

            </div>


            <div class="product-table">

                <!-- TABLE HEADER -->

                <div class="product-row product-header">

                    <span>
                        Product
                    </span>

                    <span>
                        Category
                    </span>

                    <span>
                        Price
                    </span>

                    <span>
                        Stock
                    </span>

                    <span>
                        Action
                    </span>

                </div>


                <!-- PRODUCTS WILL BE INSERTED HERE -->

                <div id="productList">

                </div>

            </div>

        </section>


    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 SmartGen Mall. All Rights Reserved.
        </p>

    </footer>



    <script src="product.js"></script>

</body>

</html>

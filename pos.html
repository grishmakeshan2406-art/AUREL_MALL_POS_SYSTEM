<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>POS | SmartGen Mall</title>

    <link rel="stylesheet" href="pos.css">

</head>


<body>

    <!-- HEADER -->

    <header>

        <nav>

            <div class="logo">
                SMARTGEN
            </div>

            <div class="page-title">
                POS / BILLING
            </div>

            <a href="shopowner.html" class="back-button">
                ← Dashboard
            </a>

        </nav>

    </header>



    <!-- MAIN -->

    <main class="pos-page">


        <!-- INTRO -->

        <section class="pos-intro">

            <p class="section-label">
                POINT OF SALE
            </p>

            <h1>
                Create Bill
            </h1>

            <p>
                Select products, manage the cart and generate a customer bill.
            </p>

        </section>



        <!-- POS AREA -->

        <section class="pos-container">


            <!-- PRODUCTS -->

            <div class="pos-products">

                <div class="pos-section-heading">

                    <div>

                        <p class="section-label">
                            AVAILABLE PRODUCTS
                        </p>

                        <h2>
                            Products
                        </h2>

                    </div>

                </div>


                <div
                    class="pos-product-list"
                    id="posProductList"
                >

                </div>

            </div>



            <!-- CART -->

            <div class="pos-cart">

                <div class="cart-heading">

                    <div>

                        <p class="section-label">
                            CURRENT ORDER
                        </p>

                        <h2>
                            Cart
                        </h2>

                    </div>

                    <span id="cartCount">
                        0 items
                    </span>

                </div>


                <div
                    class="cart-items"
                    id="cartItems"
                >

                    <div class="empty-cart">
                        Your cart is empty.
                    </div>

                </div>


                <!-- BILL SUMMARY -->

                <div class="bill-summary">

                    <div>

                        <span>
                            Subtotal
                        </span>

                        <span id="subtotal">
                            ₹0
                        </span>

                    </div>


                    <div>

                        <span>
                            Tax
                        </span>

                        <span id="tax">
                            ₹0
                        </span>

                    </div>


                    <div class="bill-total">

                        <span>
                            Total
                        </span>

                        <span id="total">
                            ₹0
                        </span>

                    </div>

                </div>


                <button
                    class="generate-bill-button"
                    id="generateBill"
                >
                    Generate Bill
                </button>

            </div>


        </section>


    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 SmartGen Mall. All Rights Reserved.
        </p>

    </footer>



    <script src="pos.js"></script>

</body>

</html>

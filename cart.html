<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | SmartGen Mall</title>

    <link rel="stylesheet" href="cart.css">

</head>


<body>

    <!-- HEADER -->

    <header>

        <nav>

            <div class="logo">
               <img src="aurel1.png">
            </div>

            <div class="page-title">
                Shopping Cart
            </div>

            <div class="cart-actions">

                <a href="customer.html">
                    ← Continue Shopping
                </a>

            </div>

        </nav>

    </header>



    <!-- MAIN -->

    <main class="cart-page">

        <section class="cart-header">

            <p class="small-text">
                SMARTGEN MALL
            </p>

            <h1>
                Your Cart
            </h1>

            <p>
                Review your selected products before checkout.
            </p>

        </section>



        <!-- CART CONTENT -->

        <section class="cart-content">


            <!-- PRODUCTS -->

            <div class="cart-products">

                <div class="cart-title">

                    <h2>
                        Your Items
                    </h2>

                    <span id="itemCount">
                        0 items
                    </span>

                </div>


                <div id="cartItems">

                    <!-- JavaScript will insert products here -->

                </div>

            </div>



            <!-- ORDER SUMMARY -->

            <aside class="cart-summary">

                <h2>
                    Order Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <span id="summaryItems">
                        0
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span id="subtotal">
                        ₹0
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <span>
                        FREE
                    </span>

                </div>


                <div class="summary-divider"></div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <strong id="total">
                        ₹0
                    </strong>

                </div>


                <a href="checkout.html" class="checkout-button">
              Proceed to Checkout →
                </a>

            </aside>


        </section>

    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 SmartGen Mall. All Rights Reserved.
        </p>

    </footer>



    <script src="cart.js"></script>

</body>

</html>
